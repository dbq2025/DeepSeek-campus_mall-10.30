server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: campus-mall
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.gdufe.mall.entity
  configuration:
    map-underscore-to-camel-case: true

mall:
  jwt:
    # 生产环境必须用环境变量覆盖，禁止把真实密钥提交到仓库
    secret: ${MALL_JWT_SECRET:campus-mall-dev-secret-key-2026-please-change-me}
    expire-hours: 2
  upload:
    dir: ./upload
  cache:
    # redis（默认，需 Redis 在跑） / local（无中间件时的降级实现）
    # 缓存读写失败会降级查库，Redis 挂掉不影响业务；临时切本地：MALL_CACHE_TYPE=local
    type: ${MALL_CACHE_TYPE:redis}
  order:
    # 待付款超时分钟数：超时后由定时任务取消并回补库存
    timeout-minutes: 30
    timeout-scan-limit: 100
    timeout-enabled: true

logging:
  level:
    com.gdufe.mall: info
