spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 本机 MySQL 8.0.34；时区参数必须带，否则时间偏 8 小时
    url: jdbc:mysql://localhost:3306/campus_mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:1234}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      pool-name: MallHikariPool
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis123}
      database: 0
      timeout: 3s
      lettuce:
        pool:
          max-active: 8
          max-idle: 4

mybatis-plus:
  configuration:
    # 开发期打印 SQL，便于核对是否下推到数据库执行
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.gdufe.mall: debug
    com.gdufe.mall.mapper: debug
